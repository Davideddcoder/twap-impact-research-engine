name: Synthetic demo checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic multi-seed evaluation
        run: python -m scripts.evaluate_synthetic --seeds 10
      - name: Run end-to-end pipeline
        run: python main.py --regenerate --num-candles 1500 --num-events 2
